name: release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: validate tag and release commit
        run: |
          python3 scripts/check-release.py --tag "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: build source archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          git archive --format=tar.gz --prefix="pg_describe-$version/" \
            --output="release-assets/pg_describe-$version.tar.gz" "$GITHUB_SHA"
          cd release-assets
          sha256sum "pg_describe-$version.tar.gz" > SHA256SUMS

      - name: assemble and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "pg_describe ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release-assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  extension:
    name: extension and upgrades (PostgreSQL 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate release metadata
        run: python3 scripts/check-release.py

      - name: build image and start server
        run: docker compose up -d --build --wait db

      - name: run the regression suite
        run: |
          docker compose exec -T db bash -lc '
            cd /src/pg_describe &&
            PGUSER=postgres PGHOST=/var/run/postgresql PGDATABASE=contrib_regression \
            make installcheck'

      - name: check fresh installation and upgrades
        run: |
          docker compose exec -T db psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f /src/pg_describe/test/upgrades.sql

      - name: show the diff on failure
        if: failure()
        run: docker compose exec -T db cat /src/pg_describe/regression.diffs || true

      - name: stop server
        if: always()
        run: docker compose down --volumes
